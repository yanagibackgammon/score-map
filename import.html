<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Score Map Import</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div class="title-group">
      <h1>IMPORT</h1>
      <span class="creator">SCORE MAP</span>
    </div>
  </header>

  <main class="import-main">
    <section class="import-card">
      <label class="field-label" for="title-input">TITLE</label>
      <input id="title-input" class="title-input" type="text" placeholder="任意のタイトル">

      <label class="field-label">XG / XGP</label>
      <div id="drop-zone" class="drop-zone" tabindex="0" role="button">
        <strong>XG棋譜をドラッグ＆ドロップ</strong>
        <span>またはクリックしてローカルファイルを選択</span>
        <input id="file-input" type="file" accept=".xg,.xgp" hidden>
      </div>
      <div id="file-info" class="file-info">未選択</div>

      <div class="privacy-note">
        選択したファイルはブラウザ内で読み込みます。この初版ではGitHubや外部サーバーへ送信しません。
      </div>

      <button id="preview-button" class="primary-button" type="button" disabled>PREVIEW</button>
      <p class="import-status" id="import-status">XG解析結果の自動抽出処理は次段階で接続します。</p>
    </section>
  </main>

  <script src="import.js"></script>
</body>
</html>
