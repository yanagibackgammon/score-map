<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Score Map | YANAGI Backgammon</title>
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <div class="title-group">
        <h1>SCORE MAP</h1>
        <a class="page-switch" href="index.html">公開</a>
        <div class="creator">
          <span>Created by</span>
          <a href="https://yanagibackgammon.github.io/" target="_blank" rel="noopener noreferrer">YANAGI Backgammon</a>
        </div>
      </div>
    </div>
  </header>

  <main class="import-main">
    <section class="import-card">
      <label class="field-label" for="title-input">DISPLAY TEXT</label>
      <input id="title-input" class="title-input" type="text">

      <label class="field-label">XG / XGP</label>
      <div id="drop-zone" class="drop-zone" tabindex="0" role="button">
        <strong>XG / XGP</strong>
        <input id="file-input" type="file" accept=".xg,.xgp" hidden>
      </div>
      <div id="file-info" class="file-info">未選択</div>

      <button id="preview-button" class="primary-button" type="button" disabled>CREATE 34 XGP</button>
      <p class="import-status" id="import-status" hidden></p>
    </section>
  </main>

  <script src="xg-batch.js?v=14"></script>
  <script src="import.js?v=14"></script>
</body>
</html>
