<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Score Map | YANAGI Backgammon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div class="title-group">
      <h1>SCORE MAP</h1>
      <span class="creator">YANAGI Backgammon</span>
    </div>
  </header>

  <main>
    <section class="position-card">
      <h2 id="position-title">Sample Position</h2>
      <div id="board" class="board-wrap" aria-label="Backgammon position"></div>
      <div id="position-meta" class="position-meta"></div>
    </section>

    <section class="map-card">
      <div class="map-heading">
        <h3>MATCH SCORE MAP</h3>
        <div class="axis-note"><strong>BLACK</strong> ↓ &nbsp; / &nbsp; <strong>WHITE</strong> →</div>
      </div>
      <div class="table-scroll">
        <table id="score-table" class="score-table" aria-label="Match score map"></table>
      </div>
      <div id="legend" class="legend"></div>
      <p class="table-note">Post Crawford × Crawford / Crawford × Post Crawford は存在しないため対象外。</p>
    </section>
  </main>

  <script src="board.js"></script>
  <script src="app.js"></script>
</body>
</html>
