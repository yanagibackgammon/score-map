<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Score Map | YANAGI Backgammon</title>
  <link rel="stylesheet" href="styles.css?v=21">
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <div class="title-group">
        <h1>SCORE MAP</h1>
        <a class="page-switch" href="import.html">作成</a>
        <div class="creator">
          <span>Created by</span>
          <a href="https://yanagibackgammon.github.io/" target="_blank" rel="noopener noreferrer">YANAGI Backgammon</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="content-grid">
      <section class="position-card">
        <div id="position-title" class="position-title" hidden></div>
        <div id="board" class="board-wrap" aria-label="Backgammon position"></div>
      </section>

      <section class="map-card">
        <div class="table-scroll">
          <table id="score-table" class="score-table" aria-label="Match score map"></table>
        </div>
      </section>
    </div>

    <div id="legend" class="legend"></div>
  </main>

  <script src="board.js"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
