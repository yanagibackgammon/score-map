name: Deploy Score Map to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "import.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "data/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          # 公開処理は position JSON と index.json を連続 commit するため、
          # workflow を起動した古い commit ではなく常に最新 main を配信する。
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='README.md' \
            ./ _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
